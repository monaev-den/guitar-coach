<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гитарный шаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EDF0EB; --surface:#FAFBF8; --soft:#E2E7E1; --ink:#19201D; --muted:#5B6862; --line:#CFD7D1;
  --accent:#9C6A12; --accent-soft:#F1E2C4; --accent-ink:#FFFFFF; --steel:#2C6862;
  --good:#2D7A4C; --bad:#B0422E; --neck:#3A2A22; --neck-line:#8E8474; --inlay:#E9C77B;
  --display:"Unbounded", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#172020; --soft:#1F2927; --ink:#E3EAE5; --muted:#97A49E; --line:#2A3632;
    --accent:#E2AF52; --accent-soft:#3A2F1A; --accent-ink:#1A1408; --steel:#71B7AF;
    --good:#5DC487; --bad:#E77B63; --neck:#2B1F19; --neck-line:#6E665A; --inlay:#E2AF52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#172020; --soft:#1F2927; --ink:#E3EAE5; --muted:#97A49E; --line:#2A3632;
  --accent:#E2AF52; --accent-soft:#3A2F1A; --accent-ink:#1A1408; --steel:#71B7AF;
  --good:#5DC487; --bad:#E77B63; --neck:#2B1F19; --neck-line:#6E665A; --inlay:#E2AF52;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:20px}
h2{font-size:17px}
h3{font-size:14px;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)}

/* week neck */
.neck{background:var(--neck);border-radius:6px 14px 14px 6px;padding:14px 10px 10px 18px;position:relative;color:#EDE6DA;border-left:6px solid #D9D2C3}
.neck-frets{display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.fret{height:54px;border-right:3px solid var(--neck-line);display:flex;align-items:center;justify-content:center;position:relative}
.fret::before{content:"";position:absolute;left:-4px;right:0;top:50%;height:1px;background:rgba(237,230,218,.14);box-shadow:0 -14px 0 rgba(237,230,218,.14),0 14px 0 rgba(237,230,218,.14)}
.inlay{width:18px;height:18px;border-radius:50%;border:2px dashed rgba(237,230,218,.3);position:relative;z-index:1}
.inlay.on{background:var(--inlay);border:0;box-shadow:0 0 0 4px rgba(233,199,123,.18)}
.inlay.today{border:2px solid var(--inlay)}
.neck-days{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;text-align:center;margin-top:6px;color:#BFB6A6;font-weight:600}
.neck-days .t{color:var(--inlay)}
.week-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.week-line b{font-family:var(--display);font-size:22px;font-weight:700}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 8px;border-radius:9px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-weight:400;font-size:12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px dashed var(--line)}
.plan li:last-child{border-bottom:0}
.plan li span:last-child{color:var(--muted);font-family:var(--mono);font-size:13px;white-space:nowrap}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:13px 18px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 180px}
.done-note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.anchor{display:flex;gap:8px;align-items:center;font-size:14px}
.anchor input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px dashed var(--line);font:inherit;color:var(--ink);padding:4px 2px}
details.how summary{cursor:pointer;font-weight:700;list-style:none}
details.how summary::after{content:" +";color:var(--muted)}
details.how[open] summary::after{content:" −"}
details.how ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{padding:8px 4px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}

/* chord diagram */
.cd{display:block;width:100%;max-width:112px;height:auto}
.cd-l{max-width:170px}
.cd .nut{stroke:var(--ink);stroke-width:4}
.cd .fr{stroke:var(--line);stroke-width:1.5}
.cd .st{stroke:var(--muted)}
.cd .dot{fill:var(--ink)}
.cd .fg{fill:var(--surface);font-size:9px;text-anchor:middle;font-weight:700;font-family:var(--body)}
.cd .mk{fill:var(--muted);text-anchor:middle;font-size:12px;font-family:var(--body)}
.cd .op{fill:none;stroke:var(--muted);stroke-width:1.5}
.chords{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.chord{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.chord.locked{opacity:.55}
.chord .nm{font-family:var(--display);font-size:18px;font-weight:700}
.chord .ru{font-size:12px;color:var(--muted);line-height:1.3}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* path */
.stages{display:flex;flex-direction:column;gap:0;position:relative}
.stage{display:grid;grid-template-columns:40px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.stage .num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;background:var(--soft);color:var(--muted)}
.stage.past .num{background:var(--steel);color:var(--surface)}
.stage.cur .num{background:var(--accent);color:var(--accent-ink)}
.stage .t{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips span{font-family:var(--mono);font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--steel);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.bars div.best{background:var(--accent)}
.goalline{position:relative}
.goalline::after{content:"";position:absolute;left:0;right:0;border-top:1.5px dashed var(--accent);bottom:var(--g)}

/* tools */
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.strings button{background:var(--soft);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center}
.strings button b{font-family:var(--display);font-size:18px}
.strings button small{font-size:11px;color:var(--muted)}
.strings button.on{background:var(--accent);color:var(--accent-ink)}
.strings button.on small{color:var(--accent-ink)}
.metro{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.metro .bpm{font-family:var(--mono);font-size:20px;font-weight:600;min-width:44px;text-align:center}
.rbtn{width:38px;height:38px;border-radius:10px;background:var(--soft);font-weight:700;font-size:18px}
.beats{display:flex;gap:8px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--soft);display:block}
.beats i.on{background:var(--accent)}
.goals{display:flex;gap:6px}
.goals button{min-width:44px;padding:8px 10px;border-radius:10px;background:var(--soft);font-weight:700;font-family:var(--mono)}
.goals button.on{background:var(--ink);color:var(--bg)}
.danger{color:var(--bad)}

/* session */
#session{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#session .wrap{display:flex;flex-direction:column;gap:16px;padding-top:14px}
.shead{display:flex;align-items:center;gap:12px}
.shead .x{width:38px;height:38px;border-radius:10px;background:var(--soft);font-size:20px;flex:none}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.timer{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--steel);width:0%;transition:width .25s linear}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pair{display:flex;gap:10px;justify-content:center;align-items:flex-start}
.pair>div{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:4px}
.big{font-family:var(--display);font-size:56px;font-weight:700;text-align:center;line-height:1}
.tap{width:100%;min-height:150px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;font-weight:700;touch-action:manipulation;user-select:none}
.tap:active{transform:scale(.985)}
.pattern{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center}
.pattern div{border-radius:10px;background:var(--soft);padding:10px 0 6px;display:flex;flex-direction:column;gap:2px;transition:background .08s}
.pattern div b{font-size:24px;line-height:1}
.pattern div small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.pattern div.rest b{color:var(--line)}
.pattern div.on{background:var(--accent);color:var(--accent-ink)}
.pattern div.on small{color:var(--accent-ink)}
.progc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.progc span{font-family:var(--display);font-weight:700;padding:8px 14px;border-radius:10px;background:var(--soft);font-size:16px}
.progc span.on{background:var(--accent);color:var(--accent-ink)}
.tab{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;white-space:pre;line-height:1.45}
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:6px 14px 14px 6px;padding:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;font-weight:700;font-size:16px}
.opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opts button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.board{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.board .str{stroke:var(--muted)}
.board .frl{stroke:var(--line);stroke-width:2}
.board .nutl{stroke:var(--ink);stroke-width:5}
.board .lab{fill:var(--muted);font-size:11px;font-family:var(--mono);text-anchor:middle}
.board .inl{fill:var(--line)}
.board .hit{fill:var(--accent)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-weight:700}
.feel button.on{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.confirm{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad);border-radius:12px;padding:12px}
@media (min-width:700px){ body{font-size:16px} h1{font-size:22px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="6" width="26" height="18" rx="3" fill="var(--neck)"/><g stroke="#D9D2C3" stroke-width="1"><line x1="2" y1="10" x2="28" y2="10"/><line x1="2" y1="13.5" x2="28" y2="13.5"/><line x1="2" y1="17" x2="28" y2="17"/><line x1="2" y1="20.5" x2="28" y2="20.5"/></g><circle cx="17" cy="15" r="3" fill="var(--inlay)"/></svg>
      <h1>Гитарный шаг</h1>
    </div>
    <div class="sync" id="sync"><i></i><span>на этом устройстве</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Разделы"><div class="in" id="tabs"></div></nav>
<div id="session" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- музыкальные данные ---------- */
const OPEN=[82.41,110,146.83,196,246.94,329.63];          // 6-я … 1-я струна
const STR=['E','A','D','G','B','E'];
const OPEN_IDX=[4,9,2,7,11,4];
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const RU={C:'до','C#':'до-диез',D:'ре','D#':'ре-диез',E:'ми',F:'фа','F#':'фа-диез',G:'соль','G#':'соль-диез',A:'ля','A#':'ля-диез',B:'си'};
const CHORDS={
  Em:{f:[0,2,2,0,0,0],fg:[0,2,3,0,0,0],t:'min',ru:'ми минор'},
  Am:{f:[-1,0,2,2,1,0],fg:[0,0,2,3,1,0],t:'min',ru:'ля минор'},
  E:{f:[0,2,2,1,0,0],fg:[0,2,3,1,0,0],t:'maj',ru:'ми мажор'},
  D:{f:[-1,-1,0,2,3,2],fg:[0,0,0,1,3,2],t:'maj',ru:'ре мажор'},
  A:{f:[-1,0,2,2,2,0],fg:[0,0,1,2,3,0],t:'maj',ru:'ля мажор'},
  G:{f:[3,2,0,0,0,3],fg:[2,1,0,0,0,3],t:'maj',ru:'соль мажор'},
  C:{f:[-1,3,2,0,1,0],fg:[0,3,2,0,1,0],t:'maj',ru:'до мажор'},
  Dm:{f:[-1,-1,0,2,3,1],fg:[0,0,0,2,3,1],t:'min',ru:'ре минор'},
  Fmaj7:{f:[-1,-1,3,2,1,0],fg:[0,0,3,2,1,0],t:'maj',ru:'лёгкий фа'},
  E5:{f:[0,2,2,-1,-1,-1],fg:[0,1,2,0,0,0],t:'5',ru:'пауэр-аккорд ми'},
  A5:{f:[-1,0,2,2,-1,-1],fg:[0,0,1,2,0,0],t:'5',ru:'пауэр-аккорд ля'}
};
const PATS=[
  {name:'Четыре вниз',s:'D-D-D-D-'},
  {name:'Вниз, вниз-вверх',s:'D-DUD-DU'},
  {name:'Народный бой',s:'D-DU-UDU'},
  {name:'Бой с глушением',s:'D-XUD-XU'}
];
const STAGES=[
  {title:'Первый аккорд',chords:['Em'],pair:['Em','Em'],prog:['Em'],pat:0,bpm:60,warm:'open',lessons:['strings','fingers','press']},
  {title:'Два минора',chords:['Am'],pair:['Em','Am'],prog:['Em','Am'],pat:0,bpm:60,warm:'open',lessons:['chord','alphabet']},
  {title:'Первая связка',chords:['E'],pair:['Am','E'],prog:['Am','E'],pat:1,bpm:65,warm:'chrom',lessons:['changes','tab']},
  {title:'Ре мажор',chords:['D'],pair:['Am','D'],prog:['Am','D','Em','Em'],pat:1,bpm:65,warm:'chrom',lessons:['rhythm']},
  {title:'Три главных аккорда',chords:['A'],pair:['A','D'],prog:['A','D','E','A'],pat:1,bpm:70,warm:'chrom',lessons:['keys']},
  {title:'Соль мажор',chords:['G'],pair:['G','D'],prog:['Em','G','D','A'],pat:2,bpm:70,warm:'chrom',lessons:[]},
  {title:'Четыре аккорда',chords:['C'],pair:['C','G'],prog:['G','D','Em','C'],pat:2,bpm:75,warm:'chrom',lessons:[]},
  {title:'Дворовый минор',chords:['Dm'],pair:['Dm','Am'],prog:['Am','Dm','E','Am'],pat:3,bpm:75,warm:'chrom',lessons:['mute']},
  {title:'Лёгкий фа',chords:['Fmaj7'],pair:['Fmaj7','C'],prog:['C','Am','Fmaj7','G'],pat:2,bpm:80,warm:'chrom',lessons:['fmaj7']},
  {title:'Пауэр-аккорды и соло',chords:['E5','A5'],pair:['E5','A5'],prog:['E5','A5','E5','A5'],pat:3,bpm:80,warm:'penta',lessons:['power','penta']}
];
const LESSONS={
  strings:{t:'Как зовут струны',b:'Струны нумеруют от тонкой к толстой: 1-я — самая тонкая, 6-я — самая толстая. Названия с 6-й по 1-ю: <b>E A D G B E</b> (ми, ля, ре, соль, си, ми). Запоминалка: «<b>Е</b>нот <b>А</b>нанас <b>Д</b>олго <b>Г</b>рыз, <b>Б</b>егемот <b>Е</b>л».'},
  fingers:{t:'Пальцы и схемы аккордов',b:'Пальцы левой руки: 1 — указательный, 2 — средний, 3 — безымянный, 4 — мизинец. На схеме аккорда вертикальные линии — струны (слева толстая 6-я), горизонтальные — лады. Цифра в кружке — какой палец ставить, <b>o</b> — струна звучит открытой, <b>×</b> — её не играем.'},
  press:{t:'Как прижимать струну',b:'Ставь палец кончиком, почти вертикально, ближе к металлической полоске (ладовому порожку) справа. Давить — ровно настолько, чтобы не дребезжало. Кончики пальцев будут побаливать 1–2 недели: лучше по 10 минут каждый день, чем час раз в неделю.'},

const LS='guitar-step-v1';

let saveTimer=null,saving=false,dirty=false;
function save(){
  S.data.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S.data));}catch(e){}
  if(S.ref){clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
}
async function flush(){
  if(!S.ref) return;
  if(saving){dirty=true;return;}
  saving=true;
  try{await S.ref.set(JSON.parse(JSON.stringify(S.data)));S.sync='cloud';}
  catch(e){ if(e&&e.code==='unavailable'){setTimeout(flush,1500+Math.random()*1000);} else {S.sync='local';} }
  saving=false;
  if(dirty){dirty=false;flush();}
  renderSync();
}
async function pullRemote(){
  if(!S.ref||saving) return;
  try{
    const snap=await S.ref.get();
    const remote=snap.exists?snap.data():null;
    if(remote&&(remote.updatedAt||0)>(S.data.updatedAt||0)){
      S.data=Object.assign(def(),JSON.parse(JSON.stringify(remote)));
      try{localStorage.setItem(LS,JSON.stringify(S.data));}catch(e){}
      if(!S.sess) render();
    }else if(!remote||(remote.updatedAt||0)<(S.data.updatedAt||0)){ if(S.data.updatedAt) flush(); }
    S.sync='cloud'; renderSync();
  }catch(e){}
}
async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id();
    if(!uid) return;
    S.ref=db.doc('data/users/'+uid+'/progress');
    await pullRemote();
  }catch(e){}
}

/* ---------- звук: щипковая струна (Karplus–Strong) и метроном ---------- */
let ctx=null; const bufCache={};
function ac(){ if(!ctx){const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C();} if(ctx.state==='suspended') ctx.resume(); return ctx; }
function pluckBuf(freq){
  const key=freq.toFixed(2); if(bufCache[key]) return bufCache[key];
  const sr=ctx.sampleRate,len=Math.floor(sr*2.4),N=Math.max(2,Math.round(sr/freq));
  const buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  let prev=0; for(let i=0;i<N;i++){const r=Math.random()*2-1;prev=prev*0.5+r*0.5;d[i]=prev;}
  const decay=freq>250?0.994:0.997;
  for(let i=N;i<len;i++) d[i]=decay*0.5*(d[i-N]+d[i-N+1]);
  return bufCache[key]=buf;
}
function note(freq,when=0,vol=0.35){
  if(!ac()) return;
  const src=ctx.createBufferSource(); src.buffer=pluckBuf(freq);
  const g=ctx.createGain(); g.gain.value=vol; src.connect(g).connect(ctx.destination);
  src.start(ctx.currentTime+when);
}
function strum(name,up=false){
  const c=CHORDS[name]; if(!c||!ac()) return;
  const idx=up?[5,4,3,2,1,0]:[0,1,2,3,4,5]; let k=0;
  idx.forEach(i=>{const f=c.f[i]; if(f<0) return; note(OPEN[i]*Math.pow(2,f/12),k*0.022,0.22); k++;});
}
function click(t,accent){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=accent?1500:1000; g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(accent?0.5:0.3,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.06);
}
function chime(){ if(!ac()) return; note(659.25,0,0.25); note(987.77,0.12,0.25); }
const Metro={on:false,bpm:70,i:0,next:0,timer:null,cb:null,
  start(){ if(!ac()) return; this.on=true; this.i=0; this.next=ctx.currentTime+0.12; this.timer=setInterval(()=>this.sched(),25); },
  stop(){ this.on=false; clearInterval(this.timer); this.timer=null; },
  toggle(){ this.on?this.stop():this.start(); },
  sched(){
    while(this.next<ctx.currentTime+0.1){
      const i=this.i,t=this.next;
      if(i%2===0) click(t,i%8===0);
      setTimeout(()=>{ if(this.on&&this.cb) this.cb(i); },Math.max(0,(t-ctx.currentTime)*1000));
      this.next+=60/this.bpm/2; this.i++;
    }
  }
};

function chordSVG(name,cls=''){
  const c=CHORDS[name],W=112,H=132,x0=18,dx=15.2,y0=30,dy=24,F=4;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="cd ${cls}" role="img" aria-label="Схема аккорда ${name}">`;
  for(let f=0;f<=F;f++){const y=y0+f*dy;s+=`<line x1="${x0}" y1="${y}" x2="${x0+5*dx}" y2="${y}" class="${f===0?'nut':'fr'}"/>`;}
  for(let i=0;i<6;i++){
    const x=x0+i*dx,f=c.f[i];
    s+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+F*dy}" class="st" stroke-width="${(1.9-i*0.22).toFixed(2)}"/>`;
    if(f<0) s+=`<text x="${x}" y="${y0-8}" class="mk">×</text>`;
    else if(f===0) s+=`<circle cx="${x}" cy="${y0-12}" r="4" class="op"/>`;
    else {const y=y0+(f-0.5)*dy;s+=`<circle cx="${x}" cy="${y}" r="7" class="dot"/><text x="${x}" y="${y+3.3}" class="fg">${c.fg[i]||''}</text>`;}
  }
  return s+'</svg>';
}
function boardSVG(si,fret,maxF=7){
  const W=340,H=150,x0=40,fw=(W-x0-12)/maxF,y0=18,sy=20;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="board" role="img" aria-label="Гриф с отмеченной нотой">`;
  [3,5,7].filter(f=>f<=maxF).forEach(f=>s+=`<circle cx="${x0+(f-0.5)*fw}" cy="${y0+2.5*sy}" r="5" class="inl"/>`);
  for(let k=1;k<=maxF;k++){const x=x0+k*fw;s+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+5*sy}" class="frl"/><text x="${x-fw/2}" y="${y0+5*sy+20}" class="lab">${k}</text>`;}
  s+=`<line x1="${x0}" y1="${y0-2}" x2="${x0}" y2="${y0+5*sy+2}" class="nutl"/>`;
  for(let r=0;r<6;r++){const i=5-r,y=y0+r*sy;
    s+=`<line x1="${x0}" y1="${y}" x2="${W-12}" y2="${y}" class="str" stroke-width="${(0.8+i*0.0+ (5-i)*0.25).toFixed(2)}"/>`;
    s+=`<text x="12" y="${y+4}" class="lab">${r===0?'e':STR[i]}</text>`;
  }
  const y=y0+(5-si)*sy, x=fret===0?x0-14:x0+(fret-0.5)*fw;
  s+=`<circle cx="${x}" cy="${y}" r="8" class="hit"/>`;
  return s+'</svg>';
}

function startGuitar(short){

  const steps=[];
  if(!short) steps.push({k:'warm',title:'Разминка',sec:120});
  steps.push({k:'chord',title:'Аккорд '+newC,chord:newC,review:prev.length?pick(prev):null,sec:short?45:90});
  steps.push({k:'changes',title:'Минута смен',sec:60,state:'idle',n:0});
  if(!short){steps.push({k:'strum',title:'Ритм',sec:120});steps.push({k:'play',title:'Играем по кругу',sec:180});}
  steps.push({k:'done',title:'Готово'});

}

/* ---------- сессия теории ---------- */
function makeQuestion(kind){
  const n=S.data.stage;
  if(kind==='string'){
    const num=1+Math.floor(Math.random()*6),i=6-num,a=STR[i];
    return {prompt:`Как называется ${num}-я струна${num===1?' (самая тонкая)':num===6?' (самая толстая)':''}?`,opts:shuffle(['E','A','D','G','B']).slice(0,4).concat([]).filter((x,k,arr)=>arr.indexOf(x)===k),ans:a,explain:`${num}-я струна — ${a} (${RU[a]}). По порядку с 6-й: E A D G B E.`,fix:true};
  }
  if(kind==='fret'){
    const strs=n>=6?[0,1,2]:[0,1],si=pick(strs),maxF=n>=5?7:5,fret=Math.floor(Math.random()*(maxF+1));
    const a=NOTES[(OPEN_IDX[si]+fret)%12];
    return {prompt:`Какая нота отмечена? ${6-si}-я струна, ${fret===0?'открытая':fret+'-й лад'}.`,visual:boardSVG(si,fret,7),opts:null,ans:a,pool:NOTES,explain:`Это ${a} (${RU[a]}). Считай от открытой ${STR[si]}: каждый лад — шаг, диеза нет между B–C и E–F.`};
  }
  if(kind==='chord'){
    const L=learned(),c=pick(L),pool=Object.keys(CHORDS);
    return {prompt:'Что это за аккорд?',visual:`<div class="pair"><div>${chordSVG(c,'cd-l')}</div></div>`,opts:null,ans:c,pool:L.length>=4?L:pool,explain:`Это ${c} — ${CHORDS[c].ru}.`,after:()=>strum(c)};
  }
  if(kind==='ear'){
    const L=learned().filter(c=>CHORDS[c].t!=='5'),c=pick(L.length>2?L:['Em','Am','E','D','A','G','C','Dm']);
    const a=CHORDS[c].t==='maj'?'Мажор — светло':'Минор — грустно';
    return {prompt:'Послушай. Мажор или минор?',visual:`<button class="btn ghost" data-a="replay">Сыграть ещё раз</button>`,opts:['Мажор — светло','Минор — грустно'],ans:a,explain:`Звучал ${c} — ${CHORDS[c].ru}.`,play:()=>strum(c),fix:true};
  }
  const bank=STATIC_Q.filter(q=>q.s<=n),q=pick(bank);
  return {prompt:q.q,opts:q.o,ans:q.a,explain:'',fix:true};
}
function finalizeOpts(q){
  if(q.fix){ if(!q.opts.includes(q.ans)) q.opts[q.opts.length-1]=q.ans; if(!q.opts.includes('Да')&&!q.opts[0].startsWith('Мажор')) q.opts=shuffle(q.opts); return q; }
  const others=shuffle(q.pool.filter(x=>x!==q.ans)).slice(0,3); q.opts=shuffle([q.ans,...others]); return q;
}
function startTheory(){
  const n=S.data.stage;
  const unseen=STAGES.slice(0,n).flatMap(s=>s.lessons).find(l=>!S.data.seen.includes(l));
  const kinds=['string','static'];
  if(n>=2) kinds.push('fret','fret','chord','chord');
  if(n>=3) kinds.push('ear','ear');
  const steps=[];
  if(unseen) steps.push({k:'lesson',id:unseen});
  for(let k=0;k<8;k++) steps.push({k:'q',q:finalizeOpts(makeQuestion(pick(kinds)))});
  steps.push({k:'tdone'});
  openSession({type:'theory',steps,ok:0});
  if(steps[0].q&&steps[0].q.play) setTimeout(()=>steps[0].q.play(),250);
}
function theoryBody(st){
  const s=S.sess;
  if(st.k==='lesson'){ const L=LESSONS[st.id];
    return `<div><span class="label">Микро-урок</span><h2>${L.t}</h2></div><div class="lesson">${L.b}</div>${nextBtn('Понятно')}`; }
  if(st.k==='q'){ const q=st.q,done=s.picked!=null;
    return `<div><span class="label">Вопрос</span><h2>${q.prompt}</h2></div>${q.visual||''}
      <div class="opts">${q.opts.map((o,k)=>{let c='';if(done){if(o===q.ans)c='ok';else if(k===s.picked)c='no';}return `<button data-a="ans" data-v="${k}" class="${c}" ${done?'disabled':''}>${o}</button>`;}).join('')}</div>
      ${done?`<p>${q.opts[s.picked]===q.ans?'<b style="color:var(--good)">Верно.</b> ':'<b style="color:var(--bad)">Не совсем.</b> '}${q.explain}</p>${nextBtn()}`:''}`; }
  if(st.k==='tdone'){ finishLog(); const qs=s.steps.filter(x=>x.k==='q').length;
    return `<div class="stack" style="text-align:center;align-items:center;padding-top:10px"><span class="label">Шаг засчитан</span>
      <div class="big">${s.ok}/${qs}</div><p>${s.ok>=qs-1?'Отлично — теория держится.':s.ok>=qs/2?'Хорошо. Ошибки — это то, что завтра запомнится лучше всего.':'Нормальный старт. Вопросы будут повторяться, пока не станут лёгкими.'}</p>
      <p class="muted">Вечером с гитарой — открой «Гитара рядом».</p></div>
      <button class="btn" data-a="sess-close">Закрыть</button>`; }
  return '';
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a,v=b.dataset.v,s=S.sess;
  switch(a){
    case 'nav': Metro.stop(); S.view=v; S.confirmReset=false; render(); window.scrollTo(0,0); break;
    case 'mode': S.data.mode=v; save(); render(); break;
    case 'start': v==='theory'?startTheory():startGuitar(v==='short'); break;
    case 'sess-close': closeSession(); break;
    case 'sess-next': {
      const st=s.steps[s.i];
      if(st.k==='lesson'&&!S.data.seen.includes(st.id)){S.data.seen.push(st.id);save();}
      if(st.k==='changes'&&st.state==='end'){const p=stage().pair,k=pairKey(p);const h=S.data.changes[k]||(S.data.changes[k]=[]);h.push({d:dk(),n:st.n});if(h.length>40)h.splice(0,h.length-40);save();}
      s.i=Math.min(s.i+1,s.steps.length-1); enterStep(); $('#session').scrollTo(0,0);
      const nx=s.steps[s.i]; if(nx.k==='q'&&nx.q.play) setTimeout(()=>nx.q.play(),250);
      break; }
    case 'ch-start': { const st=s.steps[s.i]; st.state='run'; st.n=0; st.run0=Date.now(); chime(); renderSession(); break; }
    case 'ch-tap': { const st=s.steps[s.i]; st.n++; const el=$('#chn'); if(el) el.textContent=st.n; break; }
    case 'ch-adj': { const st=s.steps[s.i]; st.n=Math.max(0,st.n+(+v)); renderSession(); break; }
    case 'metro': Metro.toggle(); b.textContent=Metro.on?'Стоп':'Метроном'; break;
    case 'bpm': Metro.bpm=Math.min(160,Math.max(40,Metro.bpm+(+v))); $('#bpmv').textContent=Metro.bpm; break;
    case 'play': strum(v); break;
    case 'string': { if(!ac()) break; const i=+v,f=OPEN[i]; note(f,0,0.4); note(f,1.1,0.4); note(f,2.2,0.4);
      b.classList.add('on'); setTimeout(()=>b.classList.remove('on'),3000); break; }
    case 'goal': S.data.goal=+v; save(); render(); break;
    case 'reset-ask': S.confirmReset=true; render(); break;
    case 'reset-no': S.confirmReset=false; render(); break;
    case 'reset-yes': S.data=def(); S.confirmReset=false; save(); render(); toast('Прогресс стёрт. Начинаем с первого аккорда.'); break;
    case 'stage': S.data.stage=+v; save(); render(); toast('Этап '+v+': '+STAGES[v-1].title); break;
    case 'stage-close': S.data.stage=+v; save(); closeSession(); toast('Открыт этап '+v+': '+STAGES[v-1].title); break;
    case 'feel': { s.feel=v; const d=S.data.days[dk()]; if(d){d.feel=v;save();} renderSession(); break; }
    case 'ans': { if(s.picked!=null) break; s.picked=+v; const q=s.steps[s.i].q; const ok=q.opts[s.picked]===q.ans; if(ok) s.ok++;
      S.data.quiz.total++; if(ok) S.data.quiz.ok++; save(); if(q.after) q.after(); renderSession(); break; }
    case 'replay': { const q=s.steps[s.i].q; if(q.play) q.play(); break; }
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='anchor'){ S.data.anchor=e.target.value.trim(); save(); toast('Запомнил: '+(S.data.anchor||'без привязки')); }
  if(e.target.id==='sndalong'&&S.sess){ S.sess.along=e.target.checked; }
});
document.addEventListener('keydown',e=>{
  const s=S.sess; if(!s) return; const st=s.steps[s.i];
  if(e.target.closest&&e.target.closest('button,input')) return;
  if(st.k==='changes'&&st.state==='run'&&(e.code==='Space'||e.key===' ')){ e.preventDefault(); st.n++; const el=$('#chn'); if(el) el.textContent=st.n; }
});

render();
initCloud();
</script>
